version: '3.8'

services:
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AUTH0_DOMAIN=${AUTH0_DOMAIN:-your-domain.auth0.com}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE:-your-api-audience}
    restart: unless-stopped

  # Note: For React Native mobile app, you'll need to run it separately
  # using 'cd apps/mobile && npm start' since it's a mobile application
  # that needs to run on a simulator or physical device
